name: WhatsApp daily digest

on:
  schedule:
    - cron: "0 9 * * *"   # every day 09:00 UTC (adjust: 14:30 IST = "30 9 * * *")
  workflow_dispatch:       # allows manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: update-news   # same group as update-news.yml so the two never race on git push

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh news
        run: python scripts/fetch_news.py

      - name: Commit refreshed data
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh news feed [skip ci]"
            # news.json is fully regenerated each run — on conflict, fresh data wins
            git pull --rebase --autostash -Xtheirs
            git push
          fi

      - name: Send WhatsApp digest
        env:
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_TO: ${{ secrets.META_TO }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python scripts/whatsapp_digest.py
