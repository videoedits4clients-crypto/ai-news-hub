name: Weekly newsletter

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC (adjust to taste)
  workflow_dispatch:       # allows manual "Run workflow" button for testing

permissions:
  contents: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh news
        run: python scripts/fetch_news.py

      - name: Send weekly digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/newsletter.py
