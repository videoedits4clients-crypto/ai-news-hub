name: Update AI news

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes — as live as free hosting gets
  workflow_dispatch:        # allows manual "Run workflow" button

permissions:
  contents: write

# Serialize runs: a new run waits instead of racing a still-running one
# (prevents "fetch first" push rejections when triggers overlap).
concurrency:
  group: update-news

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest news
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          git add data/news.json data/trending.txt data/digest.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh news feed [skip ci]"
            # news.json is fully regenerated each run — on conflict, fresh data wins
            git pull --rebase --autostash -Xtheirs
            git push
          fi
